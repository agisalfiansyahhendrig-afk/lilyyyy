<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Dulu Yuk! 🔒</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            padding: 35px 25px;
            border-radius: 28px;
            text-align: center;
            color: #333333;
            box-shadow: 0 15px 35px rgba(214, 51, 132, 0.2);
        }

        .heart-icon {
            font-size: 30px;
            background: #ffe6eb;
            width: 60px;
            height: 60px;
            line-height: 60px;
            border-radius: 18px;
            margin: 0 auto 20px auto;
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            color: #d63384;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        p.subtitle {
            font-size: 13px;
            color: #666666;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* Pin Dots */
        .dots-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border: 2px solid #ffb6c1;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .dot.active {
            background-color: #d63384;
            border-color: #d63384;
            box-shadow: 0 0 8px rgba(214, 51, 132, 0.5);
        }

        /* Keypad */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 280px;
            margin: 0 auto;
        }

        .key {
            background: #fff0f3;
            border: 1px solid #ffccd5;
            color: #d63384;
            font-size: 20px;
            font-weight: 600;
            padding: 16px 0;
            border-radius: 16px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            user-select: none;
        }

        .key:active {
            background: #d63384;
            color: #ffffff;
            transform: scale(0.95);
        }

        .error-msg {
            color: #e63946;
            font
